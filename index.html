<!DOCTYPE html>
<html>
<head>
    <title>Input Box</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: black;
        }

        input {
            width: 250px;
            height: 40px;
            background: white;
            color: black;
            border: none;
            text-align: center;
            font-size: 18px;
            outline: none;
        }
    </style>
</head>
<body>
    <input id="box" type="text" placeholder="Enter text">

    <script>
        const box = document.getElementById("box");

        box.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                alert("You entered: " + box.value);
                box.value = "";
            }
        });
    </script>
</body>
</html>
