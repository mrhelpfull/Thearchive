<!DOCTYPE html>
<html>
<head>
    <title>Text Box</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: black;
        }

        textarea {
            width: 500px;
            height: 300px;
            background: white;
            color: black;
            border: none;
            padding: 15px;
            font-size: 18px;
            resize: none;
            outline: none;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <textarea placeholder="Type here..."></textarea>
</body>
</html>
